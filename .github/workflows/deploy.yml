
name: Belajar Ads - Production Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Next.js Production
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: mysql://ci_user:ci_password@127.0.0.1:3306/belajar_ads_ci
      NEXT_PUBLIC_SITE_URL: https://belajarads.com
      AUTH_SECRET: ci-only-secret-not-used-in-production-123456789

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production application
        run: npm run build

      - name: Verify standalone output
        run: |
          test -f .next/standalone/server.js
          test -d .next/standalone/.next/static
          test -d .next/standalone/public
          echo "Standalone build verified."

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: belajar-ads-production
          path: .next/standalone/
          if-no-files-found: error
          retention-days: 7
